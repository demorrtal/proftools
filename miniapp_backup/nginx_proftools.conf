# Конфигурация Nginx для Telegram Mini App (Proftools)
# Скопируйте в /etc/nginx/sites-available/proftools
# и замените YOUR_DOMAIN.COM на ваш реальный домен

server {
    listen 80;
    server_name YOUR_DOMAIN.COM;

    # Максимальный размер загружаемых файлов
    client_max_body_size 20M;

    location / {
        # Проксирование на локальный порт FastAPI / Uvicorn
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # Поддержка WebSockets и динамических запросов
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Передача реальных заголовков клиента
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Таймауты
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
